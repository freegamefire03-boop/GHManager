org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# Enable R8 full mode for stronger optimization. Disabled: full mode strips the
# lifecycle-runtime-compose CompositionLocal (LocalLifecycleOwner) used by
# collectAsStateWithLifecycle, crashing the app on launch. Standard minify
# (minifyEnabled + shrinkResources) already provides the size/perf gains.
android.enableR8.fullMode=false
